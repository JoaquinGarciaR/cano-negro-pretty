services:
  postgres:
    image: postgres:16-alpine
    container_name: cano_negro_pretty_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cano_negro_pretty
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cano_negro_pretty"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
